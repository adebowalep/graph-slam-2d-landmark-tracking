[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-slam-2d-landmark-tracking"
version = "0.1.0"
description = "2D Graph SLAM: robot trajectory and landmark estimation from noisy motion/measurement data."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Suleiman Adebowale Ojo" }]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0"]

[project.scripts]
graph-slam-demo = "graph_slam.cli:main"

[tool.setuptools.packages.find]
include = ["graph_slam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
